# Comparable organizations: anyone who funds these is a funder prospect for Mieruka.
# From the Funder Persona Playbook (2026-11-02); tax IDs and rules confirmed from the first full
# scan (IRS years 2023-2025, 2026-11-03).
#
#   name / aliases  names it files under. An alias starting with "=" counts only as the whole name,
#                   never inside a longer one (for generic phrases like "Foundation Center").
#   eins            confirmed tax IDs; a grant to one always counts (if its purpose fits)
#   exclude_eins    tax IDs of different organizations with a similar name
#   exclude_words   a recipient name containing any of these is not this organization
#   state           two-letter state; a same-name recipient elsewhere goes to review...
#   unique          ...unless the name is unique enough to count wherever the address is
#   contains_ok     a longer name containing an alias counts (e.g. "ProPublica Illinois")
#   purpose_words   for large organizations with many programs: a grant counts only if its
#                   purpose mentions one of these words, otherwise it goes to review
#   persona         the playbook persona this organization's funders most often fit

[charity_navigator]
name = "Charity Navigator"
eins = ["13-4148824"]
state = "NJ"
unique = true
contains_ok = true     # "Charity Navigator 299 Market", "Charity Navigator Michael Thatcher" (its CEO)
# Giving Basket passes donors' gifts on to other charities
exclude_words = ["Giving Basket"]
persona = "2"

[candid]
name = "Candid"
aliases = ["=Foundation Center", "Candid formerly Foundation Center", "Foundation Center dba Candid",
           "GuideStar USA", "=GuideStar"]
eins = ["13-1837418"]
# Sierra Health Foundation Center (CA), Kalapriya Foundation Center (IL) and other "...Foundation Center" names
exclude_eins = ["45-5282243", "36-3987947", "42-1143702", "23-7444901", "72-0408921", "57-6017985",
                "83-3323923", "23-7394590", "20-2129080", "51-0198509", "34-6575496", "34-0714585"]
state = "NY"
contains_ok = true     # "Foundation Center dba Candid (GuideStar)"
unique = true          # offices in NY, DC, Atlanta, Cleveland, San Francisco and Williamsburg VA
persona = "2"

[propublica]
name = "ProPublica"
aliases = ["Pro Publica"]
eins = ["14-2007220"]
state = "NY"
unique = true
contains_ok = true     # ProPublica Illinois, Publisher's Circle, "Pro Publica Inc aka ProPublica"
persona = "2"

[aspen_open_data]
name = "Aspen Institute"
eins = ["84-0399006"]
note = "Large institute; only grants for nonprofit data or philanthropy work count."
purpose_words = ["990", "OPEN DATA", "NONPROFIT DATA", "NONPROFIT SECTOR", "PHILANTHROP"]
purpose_strict = true  # general support to Aspen says nothing about interest in nonprofit data
persona = "2"

[givewell]
name = "GiveWell"
aliases = ["The Clear Fund", "Clear Fund", "Give Well", "GiveWell Maximum Impact Fund", "GiveWell Top Charities Fund"]
eins = ["20-8625442"]
exclude_eins = ["59-3649871"]                 # GiveWell Community Foundation, Florida: a different charity
exclude_words = ["Community Foundation", "Malaria"]
state = "CA"
contains_ok = true
persona = "5"

[giving_what_we_can]
name = "Giving What We Can USA"
aliases = ["Giving What We Can"]
eins = ["93-3629215"]
contains_ok = true
persona = "5"

[fast_forward]
name = "Fast Forward"
aliases = ["FFWD", "FFWD Fast Forward", "Fast Forward FFWD", "Fast Forward Accelerate Good"]
eins = ["46-4626500"]
exclude_eins = ["47-2697519", "56-2469837", "45-3953847"]
exclude_words = ["Charter", "Futures", "Ventures", "Planet", "Life Fast Forward"]
state = "CA"
persona = "3"

[techsoup]
name = "TechSoup"
aliases = ["TechSoup Global"]
eins = ["94-3070617"]
# NGOsource is a paid service; Network for Good passes gifts through
exclude_words = ["NGOsource", "Network for Good", "Fundacja"]
state = "CA"
unique = true
persona = "3"

[nten]
name = "Nonprofit Technology Enterprise Network"
aliases = ["NTEN"]
eins = ["91-2072298"]
persona = "3"

[grantmakers_western_pa]
name = "Grantmakers of Western Pennsylvania"
eins = ["25-1496312"]
state = "PA"
contains_ok = true     # grants for its Remake Learning network, and members' dues
persona = "1"

[philanthropy_network_philadelphia]
name = "Philanthropy Network Greater Philadelphia"
aliases = ["Delaware Valley Grantmakers"]
eins = ["23-2518417"]
state = "PA"
persona = "1"

[forbes_funds]
name = "The Forbes Funds"
aliases = ["Forbes Funds"]
eins = ["25-1418095"]
state = "PA"
persona = "1"
